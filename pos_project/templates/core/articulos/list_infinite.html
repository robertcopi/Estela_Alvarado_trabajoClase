{% extends 'base.html' %}
{% block title %}Lista de Artículos (Scroll Infinito){% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Catálogo de Artículos</h2>
    <div class="w-50">
        <input type="text" id="searchInput" class="form-control" placeholder="Buscar por descripción...">
    </div>
</div>

<div class="row" id="articulos-container">
    <!-- Items will be appended here by JS -->
</div>

<div id="loading" class="text-center my-4" style="display: none;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let hasNext = true;
    let isLoading = false;
    let searchQuery = '';

    const container = document.getElementById('articulos-container');
    const loading = document.getElementById('loading');
    const searchInput = document.getElementById('searchInput');

    async function loadArticulos(reset = false) {
        if (isLoading || (!hasNext && !reset)) return;
        
        isLoading = true;
        loading.style.display = 'block';

        if (reset) {
            currentPage = 1;
            container.innerHTML = '';
        }

        try {
            const response = await fetch(`/api/articulos/?page=${currentPage}&q=${searchQuery}`);
            const data = await response.json();
            
            data.results.forEach(art => {
                const card = `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body">
                                <h5 class="card-title text-primary">${art.descripcion}</h5>
                                <h6 class="card-subtitle mb-2 text-muted">Código: ${art.codigo_articulo}</h6>
                                <p class="card-text fw-bold fs-5 mt-3">S/ ${art.precio}</p>
                            </div>
                            <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
                                <a href="/articulos/${art.articulo_id}/" class="btn btn-outline-primary btn-sm"><i class="fas fa-eye me-1"></i>Ver</a>
                                <form action="/cart/add/${art.articulo_id}/" method="post" class="d-inline">
                                    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                                    <input type="hidden" name="cantidad" value="1">
                                    <button type="submit" class="btn btn-success btn-sm"><i class="fas fa-cart-plus me-1"></i>Añadir</button>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
            
            hasNext = data.has_next;
            currentPage++;
        } catch (error) {
            console.error("Error loading items:", error);
        } finally {
            isLoading = false;
            loading.style.display = 'none';
        }
    }

    // Initial load
    loadArticulos();

    // Infinite scroll
    window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
            loadArticulos();
        }
    });

    // Search input debounce
    let timeout = null;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            searchQuery = e.target.value;
            loadArticulos(true);
        }, 500);
    });
</script>
{% endblock %}
